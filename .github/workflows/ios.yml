name: iOS checks
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test shared habit engine
        run: swift test
      - name: Check project and research
        run: python3 scripts/check-project.py
      - name: Select SDK and build app and widgets
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          fi
          xcodebuild -version
          sdk_major="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          deployment=26.0
          if [ "$sdk_major" -lt 26 ]; then
            deployment="$sdk_major.0"
            echo "::warning::Runner SDK is older than the iOS 26 deployment target; using SDK $deployment."
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          python3 scripts/generate-project.py --deployment-target "$deployment"
          xcodebuild -project HabitBuddy.xcodeproj -scheme HabitBuddy \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET="$deployment" build
      - name: Run native UI checks and capture screens
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/buddy-devices.json
          device="$(python3 - "${{ steps.sdk.outputs.deployment }}" <<'PY'
          import json, re, sys
          data=json.load(open('/tmp/buddy-devices.json'))
          minimum=int(sys.argv[1].split('.')[0])
          candidates=[]
          for runtime,items in data['devices'].items():
              if 'iOS-' not in runtime: continue
              version=tuple(map(int,re.search(r'iOS-(\d+)-(\d+)',runtime).groups()))
              if version[0]<minimum: continue
              for d in items:
                  if d.get('isAvailable') and d['name'].startswith('iPhone'): candidates.append((version,d))
          candidates.sort(key=lambda item:(-item[0][0],-item[0][1],item[1]['name']!='iPhone 16',item[1]['name']))
          assert candidates,'No compatible iPhone simulator: '+str(data['devices'].keys())
          version,phone=candidates[0]
          print('Selected '+phone['name']+' / iOS '+'.'.join(map(str,version)),file=sys.stderr)
          phones=[phone]
          print(phones[0]['udid'])
          PY
          )"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time '09:19' --batteryState charged --batteryLevel 100
          xcodebuild -project HabitBuddy.xcodeproj -scheme HabitBuddy \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath DerivedData \
            -resultBundlePath VisualAudit.xcresult -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET="${{ steps.sdk.outputs.deployment }}" test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-visual-audit
          path: VisualAudit.xcresult
          if-no-files-found: ignore
